<!DOCTYPE html>
<html>
<head>
<title>Admin Signup</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center h-screen">

<form method="POST" class="bg-white p-8 rounded shadow w-80">

<h2 class="text-xl font-bold mb-4">Admin Signup</h2>

<input type="email" name="email" placeholder="Admin Email"
class="border p-2 w-full mb-3" required>

<input type="password" name="password" placeholder="Password"
class="border p-2 w-full mb-3" required>

<button class="bg-green-500 text-white px-4 py-2 w-full">
Create Admin
</button>

<a href="/admin-login" class="text-blue-500 text-sm block mt-3">
Already have an account? Login
</a>

</form>

</body>
</html>
