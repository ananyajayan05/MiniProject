<!DOCTYPE html>
<html>
<head>
<title>Admin Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

<div class="container mx-auto p-8">

<h1 class="text-2xl font-bold mb-6">Admin Dashboard</h1>

<!-- USERS SECTION -->

<h2 class="text-xl font-semibold mb-3">Registered Users</h2>

<table class="bg-white shadow rounded w-full mb-8">

<tr class="bg-gray-200">
<th class="p-2">ID</th>
<th class="p-2">Email</th>
</tr>

{% for u in users %}

<tr class="border-t">
<td class="p-2">{{u[0]}}</td>
<td class="p-2">{{u[1]}}</td>
</tr>

{% endfor %}

</table>


<!-- PHARMACY SECTION -->

<h2 class="text-xl font-semibold mb-3">Registered Pharmacies</h2>

<table class="bg-white shadow rounded w-full">

<tr class="bg-gray-200">
<th class="p-2">ID</th>
<th class="p-2">Pharmacy Name</th>
<th class="p-2">Email</th>
</tr>

{% for p in pharmacies %}

<tr class="border-t">
<td class="p-2">{{p[0]}}</td>
<td class="p-2">{{p[1]}}</td>
<td class="p-2">{{p[2]}}</td>
</tr>

{% endfor %}

</table>

</div>

</body>
</html>
