<form method="POST" class="mb-4">
    <input type="text" name="medicine" placeholder="Medicine Name" required class="border p-2 rounded mr-2">
    <input type="number" name="quantity" placeholder="Quantity" required class="border p-2 rounded mr-2">
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Add Stock</button>
</form>

<table class="table-auto w-full border mt-4">
    <thead>
        <tr>
            <th class="border px-2 py-1">Medicine</th>
            <th class="border px-2 py-1">Quantity</th>
        </tr>
    </thead>
    <tbody>
        {% for med in stock %}
        <tr>
            <td class="border px-2 py-1">{{ med[0] }}</td>
            <td class="border px-2 py-1">{{ med[1] }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
